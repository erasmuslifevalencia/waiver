<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4A0A2A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ELV Trip</title>
<meta name="apple-mobile-web-app-title" content="ELV Trip">
<meta name="application-name" content="ELV Trip">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --plum:#8E1C55; --deep:#4A0A2A; --orange:#F07D1E; --osoft:#FFF1E4; --obrown:#6B3200; --green:#157A55; --gsoft:#E3F3EC; --gtext:#0F5E41;
    --red:#7A1A1A; --rsoft:#FDECEC; --ink:#22121B; --muted:#6E5B66; --paper:#F8F4F6; --line:#E8DDE3; --display:'Josefin Sans',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.45 var(--body); min-height: 100vh; display: flex; flex-direction: column; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  [hidden] { display: none !important; }
  header { position: sticky; top: 0; z-index: 5; background: var(--deep); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 10px; }
  .hrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 640px; margin: 0 auto; }
  .htitle { font: 700 20px/1.1 var(--display); text-transform: uppercase; letter-spacing: .01em; }
  .hsub { font-size: 13px; opacity: .85; }
  .seg { display: flex; background: rgba(255,255,255,.16); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; color: #fff; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--deep); }
  .sync { max-width: 640px; margin: 8px auto 0; border-radius: 10px; padding: 6px 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .sync.off { background: rgba(240,125,30,.25); }
  .sync.pend { background: rgba(255,255,255,.12); }
  main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 14px 14px 110px; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 6px calc(10px + env(safe-area-inset-bottom)); }
  nav.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
  nav.tabs button[aria-current="page"] { color: var(--plum); }
  .card { background: #fff; border-radius: 18px; padding: 14px 16px; }
  .card + .card, .stack > * + * { margin-top: 10px; }
  h2 { font: 700 20px/1.2 var(--display); margin: 4px 2px 10px; }
  .lbl { display: block; font-size: 13px; font-weight: 600; margin: 14px 2px 6px; }
  input[type=text], input[type=search], input[type=date], input[type=tel], input[inputmode] { width: 100%; padding: 12px 14px; font-size: 16px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; }
  input:focus { border-color: var(--plum); outline: none; box-shadow: 0 0 0 3px rgba(142,28,85,.14); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 13px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .pill[aria-pressed="true"] { background: var(--plum); border-color: var(--plum); color: #fff; }
  .busseg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #EDE3E8; border-radius: 14px; padding: 4px; margin-bottom: 10px; }
  .busseg button { border: 0; background: none; border-radius: 10px; padding: 9px 6px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .busseg button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 700; }
  .trav { background: #fff; border-radius: 16px; padding: 12px 14px; margin-top: 8px; }
  .trow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .tname { font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .chip { font-size: 12.5px; font-weight: 600; border-radius: 8px; padding: 3px 8px; }
  .chip.b { background: var(--gsoft); color: var(--gtext); }
  .chip.x { background: #E4EEFB; color: #1D4F91; }
  .chip.p { background: #EDE3E8; color: var(--muted); }
  .chip.n { background: var(--rsoft); color: var(--red); }
  .addbtn { flex: none; width: 42px; height: 42px; border-radius: 12px; border: 0; background: var(--plum); color: #fff; display: grid; place-items: center; cursor: pointer; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font-size: 17px; font-weight: 700; background: var(--plum); color: #fff; cursor: pointer; margin-top: 16px; }
  .btn.ghost { background: #fff; color: var(--plum); border: 1.5px solid var(--line); }
  .btn.green { background: #fff; color: var(--gtext); border: 1.5px solid var(--green); }
  .btn:disabled { opacity: .5; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .opt { text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 12px; cursor: pointer; }
  .opt[aria-pressed="true"] { border: 2px solid var(--plum); background: #F7E8F0; }
  .opt b { display: block; } .opt span { font-size: 14px; color: var(--muted); }
  .big { font: 700 38px/1.1 var(--display); color: var(--plum); }
  .box { border-radius: 12px; padding: 10px 12px; }
  .box.in { background: var(--gsoft); color: var(--gtext); } .box.out { background: var(--rsoft); color: var(--red); }
  .box b { display: block; font-size: 19px; }
  .entry { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center; }
  .entry:first-child { border-top: 0; }
  .entry small { display: block; color: var(--muted); font-size: 12.5px; }
  .entry .amt { font-weight: 700; white-space: nowrap; text-align: right; }
  .entry.cx { color: #A0909A; } .entry.cx .t, .entry.cx .amt { text-decoration: line-through; }
  .link { background: none; border: 0; color: var(--plum); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px 0; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: right; font-size: 12.5px; color: var(--muted); font-weight: 600; padding: 4px 0 6px; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 7px 0; border-top: 1px solid var(--line); text-align: right; }
  .muted { color: var(--muted); font-size: 14px; }
  .err { color: #B42318; font-size: 14px; margin-top: 8px; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px; z-index: 9; }
  .login { max-width: 360px; margin: 10vh auto 0; text-align: center; padding: 0 20px; }
  .login img { width: 110px; }
  .login h1 { font: 700 26px/1.2 var(--display); text-transform: uppercase; margin: 16px 0 6px; }
  .pin { text-align: center; font-size: 28px !important; letter-spacing: .3em; font-weight: 700; }
  .picked { display: flex; justify-content: space-between; align-items: center; border: 1.5px solid var(--plum); border-radius: 14px; padding: 10px 14px; background: #fff; }
  .results { border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 6px; background: #fff; }
  .results button { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: #fff; padding: 12px 14px; cursor: pointer; }
  .results button:first-child { border-top: 0; }
  nav.tabs { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .legend { background: #fff; border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
  .legend .chips { margin-top: 6px; }
  .sec { font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 4px 6px; }
  .lrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #fff; border: 0; border-radius: 16px; padding: 13px 14px; margin-top: 8px; cursor: pointer; }
  .lrow .nm { font-weight: 700; } .lrow .sub { font-size: 13px; color: var(--muted); }
  .bar { height: 6px; border-radius: 9px; background: #EDE3E8; margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); border-radius: 9px; }
  .go { margin-left: auto; color: var(--muted); font-size: 22px; }
  .counter { display: flex; gap: 8px; margin: 6px 0 10px; } .counter .box { flex: 1; border: 0; text-align: left; cursor: pointer; font: inherit; }
  .prow { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 10px 12px; margin-top: 6px; }
  .prow .nm { font-weight: 700; font-size: 15px; } .prow.here { background: #F3FAF6; }
  .check { flex: none; margin-left: auto; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; background: #fff; cursor: pointer; }
  .here .check { background: var(--green); border-color: var(--green); }
  .gb { font-size: 12px; font-weight: 700; background: #EDE3E8; border-radius: 7px; padding: 2px 7px; }
  .gseg { display: flex; gap: 4px; margin-left: auto; flex: none; }
  .gseg button { width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; font-weight: 700; cursor: pointer; }
  .gseg button[aria-pressed="true"] { background: var(--plum); border-color: var(--plum); color: #fff; }
  .toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; background: #fff; border: 0; border-radius: 14px; padding: 10px 12px; margin: 8px 0 2px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .sw { width: 42px; height: 24px; border-radius: 99px; background: #D9CCD3; position: relative; flex: none; }
  .sw::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .sw.on { background: var(--plum); } .sw.on::after { left: auto; right: 3px; }
  .tally { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px; }
  .tally div { background: #fff; border-radius: 12px; padding: 8px 10px; font-size: 14px; } .tally b { font-size: 17px; }
  .back { background: none; border: 0; font-size: 14px; font-weight: 600; color: var(--plum); margin: 0 2px 4px; padding: 4px 0; cursor: pointer; }
  .chip.d, .dep { background: #EFE6F7; color: #4B2A7A; }
  .dep { font-size: 13px; font-weight: 700; border-radius: 9px; padding: 6px 10px; border: 0; margin-left: auto; cursor: pointer; }
  .amts { display: flex; gap: 6px; margin-left: auto; flex: none; }
  .amts button { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; font-weight: 700; font-size: 14px; background: #fff; cursor: pointer; }
  .okb { margin-left: auto; flex: none; border: 1.5px solid var(--green); color: var(--gtext); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14px; background: #fff; cursor: pointer; }
  .okb.owe { border-color: var(--red); color: var(--red); }
  .done { margin-left: auto; flex: none; text-align: right; color: var(--gtext); font-weight: 700; font-size: 14px; }
  .kept { background: var(--rsoft); color: var(--red); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 8px; }
  .hline { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .hline:first-child { border-top: 0; }
  .note { font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 12px; }
</style>
</head>
<body>

<div id="loginView" class="login" hidden>
  <img src="logo.png" alt="Erasmus Life">
  <h1>Guide app</h1>
  <p class="muted">Enter your personal code</p>
  <input id="pinIn" class="pin" type="tel" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="Personal code">
  <button class="btn" id="loginBtn">Open</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="appView" hidden style="display:contents">
  <header>
    <div class="hrow">
      <div><div class="htitle" id="hTitle"></div><div class="hsub" id="hSub"></div></div>
      <div class="seg" id="curSeg" role="group" aria-label="Currency"></div>
    </div>
    <div class="sync" id="sync" hidden></div>
  </header>
  <main id="main"></main>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="trav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/></svg>Travellers</button>
    <button data-tab="add"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add extra</button>
    <button data-tab="lists"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>Lists</button>
    <button data-tab="cash"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Cash</button>
    <button data-tab="tot"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Totals</button>
  </nav>
</div>
<div class="toast" id="toast" hidden></div>

<script src="config.js?v=5"></script>
<script src="app-core.js?v=3"></script>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const S = { pin: store.get('g_pin', ''), data: null, queue: [], tab: 'trav', busView: null, cur: 'EUR', q: '', filter: '',
  add: { t: null, extra: null, choice: '', day: Core.today(), q: '' }, money: null, totDay: '', syncing: false, online: navigator.onLine,
  D: { step: 0, miss: false, form: null }, att: {}, aq: [], L: { date: Core.today(), list: null, grp: 0, miss: false, edit: false, ng: 2 } };

function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
function m(eur) { return Core.money(eur, S.data.trip, S.cur); }
function mine(e) { return String(e.bus) === String(S.data.session.bus); }

/* ---------- login & data ---------- */
async function login(pin) {
  $('loginErr').textContent = '';
  try {
    const r = await api('g_login', { pin });
    if (!r.ok) { $('loginErr').textContent = r.error === 'pin' ? 'Wrong code.' : r.error === 'blocked' ? 'Too many tries, wait 10 minutes.' : 'This trip is closed.'; return; }
    S.pin = pin; store.set('g_pin', pin); start();
  } catch (e) { $('loginErr').textContent = 'No connection. You need internet the first time.'; }
}
function logout() { if (!confirm('Log out? Entries not yet synced stay on this phone.')) return; store.del('g_pin'); S.pin = ''; location.reload(); }

function start() {
  S.data = store.get('g_data_' + S.pin, null);
  S.queue = store.get('g_queue_' + S.pin, []);
  S.att = store.get('g_att_' + S.pin, {}); S.aq = store.get('g_aq_' + S.pin, []);
  $('loginView').hidden = true; $('appView').hidden = false;
  if (S.data) { initView(); render(); } else $('main').innerHTML = '<div class="card muted">Loading your trip…</div>';
  refresh();
}
function initView() {
  if (!S.busView) S.busView = String(S.data.session.bus);
  const t = S.data.trip;
  $('hTitle').textContent = t.name + ' · Bus ' + S.data.session.bus;
  $('hSub').textContent = S.data.session.guide + (t.dates ? ' · ' + t.dates : '');
  $('curSeg').innerHTML = t.localCur && t.rate ? ['EUR', t.localCur].map(c =>
    `<button data-cur="${c}" aria-pressed="${S.cur === c}">${c === 'EUR' ? '€' : esc(c)}</button>`).join('') : '';
}
async function refresh() {
  await sync();
  try {
    const r = await api('g_data', { pin: S.pin });
    if (!r.ok) { if (/pin|inactive/.test(r.error)) { store.del('g_pin'); location.reload(); } return; }
    S.data = r; store.set('g_data_' + S.pin, r); S.online = true; mergeAtt(r.attend);
    initView(); render();
  } catch (e) { S.online = false; renderSync(); if (!S.data) $('main').innerHTML = '<div class="card">No connection and no saved data yet. Open the app once with internet.</div>'; }
}

/* ---------- offline queue ---------- */
function saveQueue() { store.set('g_queue_' + S.pin, S.queue); renderSync(); }
function queueAdd(entry) { S.queue.push({ op: 'add', entry }); saveQueue(); render(); sync(); }
function queueCancel(id) {
  const i = S.queue.findIndex(o => o.op === 'add' && o.entry.id === id);
  if (i >= 0) S.queue.splice(i, 1); else S.queue.push({ op: 'cancel', id });
  saveQueue(); render(); sync();
}
async function sync() {
  if (S.syncing || (!S.queue.length && !S.aq.length)) return;
  S.syncing = true;
  try {
    const adds = S.queue.filter(o => o.op === 'add').map(o => o.entry);
    if (adds.length) {
      const r = await api('g_add', { pin: S.pin, entries: adds });
      if (r.ok) S.queue = S.queue.filter(o => !(o.op === 'add' && r.saved.indexOf(o.entry.id) >= 0));
    }
    for (const o of S.queue.filter(o => o.op === 'cancel')) {
      const r = await api('g_cancel', { pin: S.pin, id: o.id });
      if (r.ok || r.error === 'not found' || r.error === 'not yours') S.queue = S.queue.filter(x => x !== o);
    }
    if (S.aq.length) {
      const sent = S.aq.slice(0, 500).map(k => { const p = k.split('|'), a = S.att[k] || {}; return { k, d: p[0], l: p[1], t: p[2], n: a.n || '', p: a.p ? 1 : 0, g: a.g || 0, ts: a.ts }; });
      const r = await api('g_marks', { pin: S.pin, marks: sent });
      if (r.ok) { sent.forEach(m => { if (S.att[m.k] && S.att[m.k].ts === m.ts) S.aq = S.aq.filter(k => k !== m.k); }); saveAtt(); }
    }
    S.online = true; saveQueue();
    const r = await api('g_data', { pin: S.pin });
    if (r.ok) { S.data = r; store.set('g_data_' + S.pin, r); mergeAtt(r.attend); render(); }
  } catch (e) { S.online = false; renderSync(); }
  finally { S.syncing = false; }
}
window.addEventListener('online', () => { S.online = true; sync(); refresh(); });
window.addEventListener('offline', () => { S.online = false; renderSync(); });
setInterval(() => { if (S.pin) sync(); }, 30000);

/** Server entries + entries still waiting on this phone. */
function entries() {
  const cancels = S.queue.filter(o => o.op === 'cancel').map(o => o.id);
  const server = (S.data ? S.data.entries : []).map(e => cancels.indexOf(e.id) >= 0 ? Object.assign({}, e, { status: 'CANCELLED', pending: true }) : e);
  const local = S.queue.filter(o => o.op === 'add').map(o => Object.assign({}, o.entry, { pending: true }));
  return server.concat(local);
}

/* ---------- render ---------- */
function renderSync() {
  const el = $('sync'), n = S.queue.length, k = S.aq.length;
  const what = [n ? n + ' entr' + (n > 1 ? 'ies' : 'y') : '', k ? k + ' tick' + (k > 1 ? 's' : '') : ''].filter(Boolean).join(' + ');
  if (!S.online) { el.hidden = false; el.className = 'sync off'; el.textContent = 'No network' + (what ? ' · ' + what + ' will sync later' : ' · showing saved data'); }
  else if (what) { el.hidden = false; el.className = 'sync pend'; el.textContent = 'Syncing ' + what + '…'; }
  else el.hidden = true;
}
function render() {
  if (!S.data) return;
  renderSync();
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
  $('main').innerHTML = { trav: vTrav, add: vAdd, lists: vLists, cash: vCash, tot: vTot }[S.tab]();
  if (S.tab === 'add' && S.add.focus) { const i = $('addQ'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } S.add.focus = false; }
  if (S.D.focus) { const i = $(S.D.focus === true ? 'dQ' : S.D.focus); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } S.D.focus = false; }
  if (S.tab === 'trav' && S.focusSearch) { const i = $('tq'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } S.focusSearch = false; }
}

function extrasOf(id, all) {

    h += `<input id="dQ" type="search" placeholder="+ Add a person (type a name)" value="${esc(F.q)}" autocomplete="off" style="margin-top:8px">` +
      (res.length ? '<div class="results">' + res.map(z => `<button data-kadd="${esc(z.id)}">${esc(z.name)}</button>`).join('') + '</div>' : '');
  } else if (kept < 0) h += '<div class="err">That is more than you gave.</div>';
  return h + '<div class="err" id="dErr"></div><button class="btn" data-act="dsave">Save</button></div>';
}
function keepDep() {
  const F = S.D.form; if (!F) return;
  if ($('dName')) F.name = $('dName').value;
  if ($('dAmt')) F.amount = $('dAmt').value;
  if ($('dWhy')) F.why = $('dWhy').value;
  document.querySelectorAll('[data-kamt]').forEach(i => { F.kept[+i.dataset.kamt].amt = i.value; });
}
function saveDep() {
  keepDep();
  const F = S.D.form, st = Core.depState(entries().filter(mine)), num = v => Math.round(parseFloat(String(v).replace(',', '.')) * 100) / 100;
  const err = t => { $('dErr').textContent = t; };
  if (F.kind === 'hotel') {
    const a = num(F.amount);
    if (!F.name.trim()) return err('Add the hotel name.');
    if (!(a > 0)) return err('Enter the amount.');
    S.queue.push({ op: 'add', entry: depEntry('DEP_HOTEL', { description: F.name.trim(), party: F.name.trim(), amount: a, eur: a }) });
  } else {
    const given = +st.open.out.eur || 0, back = num(F.amount);
    if (isNaN(back) || back < 0) return err('Enter the amount you got back (0 if nothing).');
    if (back > given) return err('That is more than you gave.');
    const kept = Math.round((given - back) * 100) / 100;
    const ks = F.kept.map(k => ({ tid: k.tid, amt: num(k.amt) })).filter(k => k.amt > 0);
    if (kept > 0) {
      if (!F.why.trim()) return err('Add the reason.');
      if (!ks.length) return err('Add who the money is for.');
      if (Math.abs(ks.reduce((a, k) => a + k.amt, 0) - kept) > 0.009) return err('The amounts must add up to ' + m(kept) + '.');
    }
    const now = nowIso();
    S.queue.push({ op: 'add', entry: depEntry('DEP_BACK', { created: now, description: st.open.name, party: st.open.name, amount: back, eur: back }) });
    if (kept > 0) ks.forEach(k => { const x = S.data.travellers.find(z => String(z.id) === String(k.tid));
      S.queue.push({ op: 'add', entry: depEntry('DEP_KEPT', { created: now, travellerId: k.tid, traveller: x ? x.name : '', description: F.why.trim(), party: st.open.name, amount: k.amt, eur: k.amt }) }); });
  }
  S.D.form = null; saveQueue(); sync(); toast('Saved'); render(); window.scrollTo(0, 0);
}
function depClick(d) {
  const st = Core.depState(entries().filter(mine)), x = id => S.data.travellers.find(z => String(z.id) === String(id));
  if (d.dstep !== undefined) { S.D.step = +d.dstep; S.D.form = null; render(); return true; }
  if (d.dgive) {
    let a = d.amt;
    if (a === 'other') { a = prompt('Amount given by ' + x(d.dgive).name + ' (€)'); if (a == null) return true; }
    a = Math.round(parseFloat(String(a).replace(',', '.')) * 100) / 100;
    if (!(a > 0)) { toast('Enter an amount'); return true; }
    queueAdd(depEntry('DEP_IN', { travellerId: d.dgive, traveller: x(d.dgive).name, amount: a, eur: a }));
    toast(x(d.dgive).name + ' · ' + m(a)); return true;
  }
  if (d.dundo) {
    const p = st.per[d.dundo];
    if (p && p.ret) { toast('Already given back'); return true; }
    if (p && confirm('Undo the deposit of ' + m(p.gave) + ' for ' + x(d.dundo).name + '?')) p.inIds.forEach(queueCancel);
    return true;
  }
  if (d.dret) {
    if (st.open && !confirm('The deposits are still at ' + st.open.name + '. Continue anyway?')) return true;
    const p = st.per[d.dret], due = Math.round((p.gave - p.kept) * 100) / 100, n = x(d.dret).name;
    const msg = due > 0 ? 'Give ' + m(due) + ' back to ' + n + '?' : due < 0 ? 'Did ' + n + ' pay you the ' + m(-due) + ' missing?' : 'Nothing to give back to ' + n + '. Mark as done?';
    if (confirm(msg)) queueAdd(depEntry('DEP_RET', { travellerId: d.dret, traveller: n, amount: due, eur: due }));
    return true;
  }
  if (d.dunret) { const p = st.per[d.dunret]; if (p && p.ret && confirm('Undo?')) queueCancel(p.ret.id); return true; }
  if (d.kadd) { keepDep(); const F = S.D.form, given = +st.open.out.eur || 0, kept = given - (parseFloat(String(F.amount).replace(',', '.')) || 0);
    const left = Math.round((kept - F.kept.reduce((a, k) => a + (parseFloat(String(k.amt).replace(',', '.')) || 0), 0)) * 100) / 100;
    F.kept.push({ tid: d.kadd, amt: left > 0 ? String(left) : '' }); F.q = ''; render(); return true; }
  if (d.kdel !== undefined) { keepDep(); S.D.form.kept.splice(+d.kdel, 1); render(); return true; }
  const a = d.act;
  if (a === 'dmiss') { S.D.miss = !S.D.miss; render(); return true; }
  if (a === 'dhotel') { S.D.form = { kind: 'hotel', name: '', amount: String(Math.round(st.pocket * 100) / 100) }; render(); window.scrollTo(0, 0); return true; }
  if (a === 'dback') { S.D.form = { kind: 'back', amount: String(+st.open.out.eur || 0), why: '', kept: [], q: '' }; render(); window.scrollTo(0, 0); return true; }
  if (a === 'dclose') { S.D.form = null; render(); return true; }
  if (a === 'dsave') { saveDep(); return true; }
  return false;
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.tab) { if (d.tab === 'lists' && S.tab === 'lists') S.L.list = null; S.tab = d.tab; S.money = null; S.L.edit = false; render(); window.scrollTo(0, 0); return; }
  if (d.cur) { S.cur = d.cur; initView(); render(); return; }
  if (d.bus) { S.busView = d.bus; render(); return; }
  if (d.filter !== undefined) { S.filter = d.filter; render(); return; }
  if (d.addfor) { S.add = { t: d.addfor, extra: null, choice: '', day: S.add.day || Core.today(), q: '', basket: [] }; S.tab = 'add'; render(); window.scrollTo(0, 0); return; }
  if (d.pick) { S.add.t = d.pick; render(); return; }
  if (d.extra) { S.add.extra = d.extra; S.add.choice = ''; render(); return; }
  if (d.choice) { S.add.choice = d.choice; render(); return; }
  if (d.money) { S.money = { type: d.money, desc: '', party: '', amount: '', cur: 'EUR' }; render(); window.scrollTo(0, 0); return; }
  if (d.mtype) { keepMoney(); S.money.type = d.mtype; render(); return; }
  if (d.mcur) { keepMoney(); S.money.cur = d.mcur; render(); return; }
  if (d.day !== undefined) { S.totDay = d.day; render(); return; }
  if (S.tab === 'lists' && S.L.list === '__dep' && depClick(d)) return;
  if (d.ldate) { S.L.date = d.ldate; S.L.list = null; render(); return; }
  if (d.lopen) { Object.assign(S.L, { list: d.lopen, grp: 0, miss: false, edit: false, ng: 2 }); S.D.form = null; S.D.miss = false; render(); window.scrollTo(0, 0); return; }
  if (d.lback) { S.L.list = null; render(); window.scrollTo(0, 0); return; }
  if (d.lgrp !== undefined) { S.L.grp = +d.lgrp; render(); return; }
  if (d.lmark || d.lset) {
    const x = S.data.travellers.find(z => String(z.id) === String(d.lmark || d.lset)); if (!x) return;
    if (d.lmark) setMark(S.L.list, x, { p: markOf(S.L.list, x).p ? 0 : 1 });
    else { const g = +d.g; setMark(S.L.list, x, { g: markOf(S.L.list, x).g === g ? 0 : g }); }
    return;
  }
  if (d.unbasket !== undefined) { S.add.basket.splice(+d.unbasket, 1); render(); return; }
  if (d.cancel) {
    const en = entries().find(x => x.id === d.cancel);
    if (en && confirm('Cancel this entry? It stays visible, crossed out.')) { queueCancel(d.cancel); toast('Cancelled'); }
    return;
  }
  const a = d.act;
  if (a === 'unpick') { S.add.t = null; S.add.q = ''; S.add.basket = []; S.add.focus = true; render(); }
  if (a === 'sell') sell();
  if (a === 'toBasket') toBasket();
  if (a === 'saveMoney') saveMoney();
  if (a === 'closeMoney') { S.money = null; render(); }
  if (a === 'copyTot') copyTot();
  if (a === 'logout') logout();
  if (a === 'lmiss') { S.L.miss = !S.L.miss; render(); }
  if (a === 'ledit') { S.L.edit = true; render(); window.scrollTo(0, 0); }
  if (a === 'ledone') { S.L.edit = false; S.L.grp = 0; render(); window.scrollTo(0, 0); }
  if (a === 'laddg') { const z = listsFor(S.L.date).find(y => y.label === S.L.list); S.L.ng = Math.max(S.L.ng, ...(z ? z.members.map(m => markOf(S.L.list, m.x).g || 0) : [0])) + 1; render(); }
  if (a === 'lreset') {

    if (z && confirm('Untick everyone in ' + S.L.list + '? Groups stay.')) z.members.forEach(m => { if (markOf(S.L.list, m.x).p) setMark(S.L.list, m.x, { p: 0 }); });
  }
});

function keepMoney() { if (!$('mDesc')) return; S.money.desc = $('mDesc').value; S.money.party = $('mParty').value; S.money.amount = $('mAmt').value; }

function nowIso() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function currentItem() {
  const t = S.data.trip, A = S.add, x = t.extras.find(z => z.name === A.extra);
  if (!x || (x.choices.length && !A.choice)) return null;
  return { extra: x.name, choice: A.choice, day: x.askDay ? A.day : '', price: Core.price(x, A.choice) };
}
function toBasket() {
  const it = currentItem(); if (!it) return;
  S.add.basket = (S.add.basket || []).concat([it]); S.add.extra = null; S.add.choice = ''; render();
}
function sell() {
  const A = S.add, tr = S.data.travellers.find(z => String(z.id) === String(A.t));
  const items = (A.basket || []).concat(currentItem() ? [currentItem()] : []);
  if (!tr || !items.length) return;
  const now = nowIso();
  items.forEach(it => S.queue.push({ op: 'add', entry: { id: Core.uid(), created: now, type: 'SALE', travellerId: tr.id, traveller: tr.name,
    extra: it.extra, choice: it.choice, day: it.day, bus: S.data.session.bus, guide: S.data.session.guide, amount: it.price, currency: 'EUR', eur: it.price, status: 'OK' } }));
  saveQueue(); sync();
  const total = items.reduce((a, b) => a + b.price, 0);
  toast('Saved · ' + items.length + ' extra' + (items.length > 1 ? 's' : '') + ' · ' + m(total) + ' · ' + tr.name);
  S.add = { t: null, extra: null, choice: '', day: A.day, q: '', focus: true, basket: [] }; render();
}
function saveMoney() {
  keepMoney();
  const t = S.data.trip, M = S.money, amt = parseFloat(String(M.amount).replace(',', '.'));
  if (!M.desc.trim()) { $('mErr').textContent = 'Add a description.'; return; }
  if (!(amt > 0)) { $('mErr').textContent = 'Enter an amount.'; return; }
  const local = t.localCur && M.cur === t.localCur && t.rate;
  queueAdd({ id: Core.uid(), created: nowIso(), type: M.type, description: M.desc.trim(), party: M.party.trim(), amount: amt,
    currency: local ? t.localCur : 'EUR', eur: local ? Math.round(amt / t.rate * 100) / 100 : amt, bus: S.data.session.bus, guide: S.data.session.guide, status: 'OK' });
  S.money = null; toast('Saved'); render();
}
async function copyTot() {
  const t = S.data.trip, ex = Core.extraTotals(t, entries(), S.totDay);
  let txt = t.name + (S.totDay ? ' – ' + Core.dayLabel(S.totDay) : '') + '\n';
  ex.forEach(x => { if (!x.total) return; txt += '\n' + x.name + ': ' + x.total + '\n'; if (x.rows.length > 1) x.rows.forEach(r => { if (r.total) txt += '  ' + r.label + ': ' + r.total + '\n'; }); });
  try { await navigator.clipboard.writeText(txt); toast('Copied'); } catch (e) { prompt('Copy this text:', txt); }
}

$('loginBtn').onclick = () => login($('pinIn').value.trim());
$('pinIn').addEventListener('keydown', e => { if (e.key === 'Enter') login($('pinIn').value.trim()); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (S.pin) start(); else { $('loginView').hidden = false; $('pinIn').focus(); }
</script>
